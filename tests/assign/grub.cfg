# The assignment guest's own GRUB menu, on its EFI disk: Debian's kernel and
# the guest's initramfs from the same volume, on the serial console, booted
# at once. The line it prints tells the runner that the guest's GRUB ran.
set timeout=0
echo 'ASSIGNGUEST GRUB'
linux /vmlinuz console=ttyS0 panic=-1 assign.gpu
initrd /initrd
boot
