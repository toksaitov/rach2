# dnsmasq.conf: DHCP, DNS and IPv6 router advertisements for the Linux AP
# guest's two networks: rach2-net on br0 and rach2-other on wlan2. Each
# network leases from .50 upward in order, so the first station has a known
# address there, which the guest's forwarded SSH ports name.

user=root
group=root
# DNS listens on the wildcard address, dnsmasq's default, and answers what
# arrives on the interfaces below. Under bind-dynamic, which keeps a socket
# for each address and follows netlink's events, dnsmasq 2.92 at times kept
# no UDP socket on br0's 192.168.71.1 after the robust case moved br0 to
# another subnet and back, and the kernel refused every IPv4 query to it
# (dev-log/84-locks/upstream.md).
interface=br0
interface=wlan2
except-interface=eth0
except-interface=eth1
no-resolv
no-hosts
server=10.0.2.3
log-facility=/run/wifiap/dnsmasq.log
log-dhcp
dhcp-leasefile=/run/wifiap/dnsmasq.leases
dhcp-authoritative
dhcp-sequential-ip
dhcp-range=set:a,192.168.71.50,192.168.71.59,255.255.255.0,1h
dhcp-range=set:b,192.168.72.50,192.168.72.59,255.255.255.0,1h
enable-ra
dhcp-range=::,constructor:br0,ra-only,64,1h
dhcp-range=::,constructor:wlan2,ra-only,64,1h
domain=wifi.test
local=/wifi.test/
# The suite's traffic endpoint is the host, which QEMU's network gives the
# guest as 10.0.2.2; the stations reach it through the guest's NAT.
host-record=endpoint.wifi.test,10.0.2.2
host-record=ap.wifi.test,192.168.71.1,fd71::1
host-record=ap-other.wifi.test,192.168.72.1,fd72::1
