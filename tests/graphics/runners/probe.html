<!DOCTYPE html>
<!-- probe.html: the speed gate's WebGL checks, a blended fill and an ALU
     loop, timed in the browser and posted to server.py's /event. probe.sh
     opens it; see that script for what each measure is. -->
<html>
<head>
<meta charset="utf-8">
<title>probe</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<script>
"use strict";
var SIZE = 1024, FILLS = 200, LOOPS = 512, PASSES = 4, ROUNDS = 5;

function post(event) {
  var r = new XMLHttpRequest();
  r.open("POST", "/event", false);
  r.setRequestHeader("Content-Type", "application/json");
  r.send(JSON.stringify(event));
}

function median(v) {
  v = v.slice().sort(function (a, b) { return a - b; });
  return v[Math.floor(v.length / 2)];
}

function program(gl, vs, fs) {
  var p = gl.createProgram();
  [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
    var sh = gl.createShader(s[0]);
    gl.shaderSource(sh, s[1]);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
      throw new Error("compile: " + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  });
  gl.bindAttribLocation(p, 0, "pos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error("link: " + gl.getProgramInfoLog(p));
  return p;
}

// sync: wait for the GPU by reading one pixel back.
function sync(gl) {
  var px = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return px;
}

// timed: the median milliseconds of ROUNDS runs of draw, after one to warm up.
function timed(gl, draw) {
  var t = [];
  for (var i = 0; i <= ROUNDS; i++) {
    sync(gl);
    var t0 = performance.now();
    draw();
    sync(gl);
    if (i > 0)
      t.push(performance.now() - t0);
  }
  return median(t);
}

function measure(api) {
  var canvas = document.createElement("canvas");
  canvas.width = canvas.height = SIZE;
  document.body.appendChild(canvas);
  var attrs = {antialias: false, depth: false, stencil: false, alpha: false,
               preserveDrawingBuffer: false, powerPreference: "high-performance"};
  var gl = canvas.getContext(api === 1 ? "webgl" : "webgl2", attrs);
  var result = {kind: "probe", api: api};
  if (!gl) {
    result.error = "no context";
    document.body.removeChild(canvas);
    return result;
  }
  var info = gl.getExtension("WEBGL_debug_renderer_info");
  result.renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  gl.viewport(0, 0, SIZE, SIZE);
  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  var vs = "attribute vec2 pos; varying vec2 uv;" +
           "void main() { uv = pos * 0.5 + 0.5; gl_Position = vec4(pos, 0.0, 1.0); }";
  // The fill: FILLS full-canvas quads, blended, with a constant colour.
  var fill = program(gl, vs, "precision mediump float; varying vec2 uv;" +
                     "void main() { gl_FragColor = vec4(uv, 0.5, 0.1); }");
  gl.useProgram(fill);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  var ms = timed(gl, function () {
    for (var i = 0; i < FILLS; i++)
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  });
  result.fill_mpix = FILLS * SIZE * SIZE / (ms * 1000);
  gl.disable(gl.BLEND);
  // The ALU loop: PASSES full-canvas quads whose every fragment runs LOOPS
  // dependent multiply-adds and a sine, in registers.
  var alu = program(gl, vs, "precision highp float; varying vec2 uv;" +
                    "void main() { float a = uv.x, b = uv.y;" +
                    "for (int i = 0; i < " + LOOPS + "; i++) { a = fract(a * 1.0001 + b); b = sin(a + b); }" +
                    "gl_FragColor = vec4(a, b, 0.0, 1.0); }");
  gl.useProgram(alu);
  result.alu_ms = timed(gl, function () {
    for (var i = 0; i < PASSES; i++)
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  });
  result.error = gl.getError() === gl.NO_ERROR ? "" : "GL error " + gl.getError();
  var lose = gl.getExtension("WEBGL_lose_context");
  if (lose)
    lose.loseContext();
  document.body.removeChild(canvas);
  return result;
}

window.onload = function () {
  [1, 2].forEach(function (api) {
    var r;
    try {
      r = measure(api);
    } catch (e) {
      r = {kind: "probe", api: api, error: String(e)};
    }
    post(r);
  });
  post({kind: "done"});
};
</script>
</body>
</html>
