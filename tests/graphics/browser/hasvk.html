<!doctype html>
<meta charset="utf-8">
<title>Haswell WebGPU picture</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="picture"></canvas>
<script>
/* Draw the Linux reference's triangle for 480 frames, then hold it for capture. */
'use strict';
(async () => {
 const result = {ok: false};
 // Each setup step's time in ms after the document's time origin, and that
 // origin in ms of the Unix epoch, to place the frames on a sampler's clock.
 result.timeOrigin = performance.timeOrigin;
 const phases = result.phases = {};
 const phase = name => { phases[name] = Math.round(performance.now() * 10) / 10; };
 try {
  phase('begin');
  const adapter = await navigator.gpu.requestAdapter();
  phase('adapter');
  if (!adapter) throw Error('no WebGPU adapter');
  const info = adapter.info;
  result.adapter = {vendor: info.vendor, architecture: info.architecture,
   device: info.device, description: info.description, isFallbackAdapter: info.isFallbackAdapter};
  if (info.vendor !== 'intel' || info.architecture !== 'gen-7' || info.isFallbackAdapter)
   throw Error('no native Intel gen-7 adapter');
  const device = await adapter.requestDevice();
  phase('device');
  device.addEventListener('uncapturederror', event => { result.error = String(event.error); });
  device.lost.then(reason => { result.error = 'device lost: ' + reason.message; });
  const canvas = document.querySelector('canvas');
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({device, format, alphaMode: 'opaque'});
  result.canvas = [canvas.width, canvas.height, format];
  phase('configured');
  const module = device.createShaderModule({code: `
   struct O { @builtin(position) p: vec4f, @location(0) c: vec3f };
   @vertex fn vs(@builtin(vertex_index) i: u32) -> O {
    var p = array<vec2f, 3>(vec2f(0.0, 0.8), vec2f(-0.8, -0.8), vec2f(0.8, -0.8));
    var c = array<vec3f, 3>(vec3f(1, 0, 0), vec3f(0, 1, 0), vec3f(0, 0, 1));
    var o: O; o.p = vec4f(p[i], 0, 1); o.c = c[i]; return o;
   }
   @fragment fn fs(i: O) -> @location(0) vec4f { return vec4f(i.c, 1); }`});
  const pipeline = device.createRenderPipeline({layout: 'auto', vertex: {module, entryPoint: 'vs'},
   fragment: {module, entryPoint: 'fs', targets: [{format}]}});
  phase('pipeline');
  let frames = 0;
  const start = performance.now();
  result.start = Math.round(start * 10) / 10;
  const times = [];
  const starts = [];
  const ends = [];
  await new Promise((resolve, reject) => {
   function draw(now) {
    try {
     times.push(Math.round((now - start) * 10) / 10);
     starts.push(Math.round((performance.now() - start) * 10) / 10);
     // A trace's user timing marks give, on its own clock, the first 16
     // frames, which stall.py searches for the slowest gap.
     if (frames < 16) performance.mark('hasvk-frame-' + frames);
     if (result.error) throw Error(result.error);
     const encoder = device.createCommandEncoder();
     const pass = encoder.beginRenderPass({colorAttachments: [{
      view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store',
      clearValue: {r: 0.1, g: 0.1, b: 0.3, a: 1}}]});
     pass.setPipeline(pipeline); pass.draw(3); pass.end();
     device.queue.submit([encoder.finish()]);
     ends.push(Math.round((performance.now() - start) * 10) / 10);
     if (++frames < 480) requestAnimationFrame(draw); else resolve();
    } catch (error) { reject(error); }
   }
   requestAnimationFrame(draw);
  });
  result.frames = frames;
  result.seconds = (performance.now() - start) / 1000;
  // Each frame's callback time in ms after start, to tell a slow start from a slow rate.
  result.frameTimes = times;
  // When each callback ran and returned, beside the frame time it was given,
  // to tell a wait inside the page's own calls from a wait for the next frame.
  result.frameStarts = starts;
  result.frameEnds = ends;
  const copy = document.createElement('canvas');
  copy.width = canvas.width; copy.height = canvas.height;
  const read = copy.getContext('2d'); read.drawImage(canvas, 0, 0);
  result.centerPixel = Array.from(read.getImageData(canvas.width >> 1, Math.round(canvas.height * 0.6), 1, 1).data);
  result.cornerPixel = Array.from(read.getImageData(2, 2, 1, 1).data);
  await device.queue.onSubmittedWorkDone();
  if (result.error) throw Error(result.error);
  result.ok = true;
 } catch (error) { result.error = String(error); }
 window.result = result;
})();
</script>
