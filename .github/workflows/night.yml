# night: every suite on both architectures, once a night.
#
# The run starts at 19:17 UTC, 01:17 at the owner's UTC+6, on the newest master;
# it is due off the hour because GitHub delays or drops scheduled runs due at
# the start of an hour under load. It runs the two architectures one after the
# other on one runner, so that the core runs of the night keep the other. It is
# outside the core runs' group, and a night that has not ended when the next one
# is due makes that one wait. tools/ci/run.sh runs the build and every suite of
# the architecture, `bigmem` last and alone; tools/ci/report.sh files what fails
# as core runs do, under the status `ci/night/ARCH`. A run that a person cancels
# reports nothing. GitHub cancels a job that passes its time limit too, so each
# architecture has 340 minutes of its own inside the job's, which leave time for
# the report. At the limit timeout(1) sends TERM to the run's process group, and
# run.sh ends once tests/run has stopped its machines, so that the next
# architecture starts on a free tree; the architecture that ran out of time is
# reported as unfinished.
name: night

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: night
  cancel-in-progress: false

jobs:
  night:
    runs-on: [self-hosted, rach2]
    timeout-minutes: 720
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/master" --jq .sha)
          [ -n "$sha" ] || { echo "night: head: no commit for master" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: i686
        env:
          ARCH: i686
        run: timeout -k 60 340m sh tools/ci/run.sh night "$RUNNER_TEMP/results/night-i686" || true

      - name: x86_64
        env:
          ARCH: x86_64
        run: timeout -k 60 340m sh tools/ci/run.sh night "$RUNNER_TEMP/results/night-x86_64" || true

      - name: keep the i686 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-i686
          path: ${{ runner.temp }}/results/night-i686
          retention-days: 14

      - name: keep the x86_64 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-x86_64
          path: ${{ runner.temp }}/results/night-x86_64
          retention-days: 14

      - name: report
        if: ${{ !cancelled() && steps.head.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.head.outputs.sha }}
        run: sh tools/ci/report.sh night "$SHA" "$RUNNER_TEMP/results"

      - name: result
        run: |
          for arch in i686 x86_64; do
              [ -f "$RUNNER_TEMP/results/night-$arch/done" ] &&
                  [ -f "$RUNNER_TEMP/results/night-$arch/failed" ] &&
                  [ ! -s "$RUNNER_TEMP/results/night-$arch/failed" ] || exit 1
          done
