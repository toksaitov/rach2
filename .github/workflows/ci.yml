# ci: the core tier on both architectures after each push to master, and
# when a person or the manager starts it by hand.
#
# The jobs run on the testing host's two runners, rach2-ci-1 and rach2-ci-2,
# which run as the user ghrunner in WSL; tools/Readme.md describes them. A
# runner keeps its checkout and its build/ between jobs, so a job rebuilds
# only what changed. One core run runs at a time and is never cancelled; of
# the runs started while it runs, only the newest waits, since GitHub cancels
# a waiting run when a newer one joins the group. The first job reads the
# newest master once the run starts, and both architectures test that one
# commit, one on each runner. A run that a push started passes over a commit
# whose `ci/core` status an earlier run set, once it had reported
# everything; a run started by hand, `gh workflow run ci.yml`, tests the
# commit all the same, so that a core failure that did not repeat in its
# bisection can be tried again. tools/ci/run.sh runs the build,
# `tests/run style`, `tests/run host` and `tests/run core`. Each
# architecture's output and kept logs are uploaded for every account to
# fetch, and its verdict, `done` followed by the steps that failed, is also
# an output of the job, so that a run whose upload was lost is still judged.
# tools/ci/report.sh sets the commit's status, files a failure as an issue,
# starts bisect.yml for a new one or one labelled `intermittent`, opens or
# closes the `hold` issue, and starts this workflow again when GitHub gave a
# core job to no runner. A run that a person cancels reports nothing.
# The core step has 170 minutes, inside the job's 180, after which
# timeout(1) stops the run as tools/ci/run.sh describes, and the run is
# reported as unfinished.
name: Core tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: core
  cancel-in-progress: false

jobs:
  head:
    name: Choose the commit
    runs-on: [self-hosted, rach2]
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tested: ${{ steps.head.outputs.tested }}
    steps:
      - name: Find master's newest commit and whether it was tested
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/$REPO/commits/master" --jq .sha)
          tested=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "ci/core")] | length')
          [ "$EVENT" != workflow_dispatch ] || tested=0
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  core:
    name: Test on ${{ matrix.arch }}
    needs: head
    if: needs.head.outputs.tested == '0'
    runs-on: [self-hosted, rach2]
    timeout-minutes: 180
    outputs:
      i686: ${{ steps.verdict.outputs.i686 }}
      x86_64: ${{ steps.verdict.outputs.x86_64 }}
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Build, then run style, host and core
        run: timeout -k 60 170m sh tools/ci/run.sh core "$RUNNER_TEMP/core-$ARCH"

      - name: Record the result for the report
        id: verdict
        if: always()
        run: |
          out=$RUNNER_TEMP/core-$ARCH
          if [ -f "$out/done" ] && [ -f "$out/failed" ]; then
              echo "$ARCH=done $(tr '\n' ' ' < "$out/failed")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.arch }}
          path: ${{ runner.temp }}/core-${{ matrix.arch }}
          retention-days: 14

  report:
    name: Report the results
    needs: [head, core]
    if: ${{ !cancelled() && needs.head.result == 'success' && needs.head.outputs.tested == '0' }}
    runs-on: [self-hosted, rach2]
    steps:
      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Make the results directory
        run: mkdir -p "$RUNNER_TEMP/results"

      - name: Download the logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/results

      - name: Set the commit's status and file failures as issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT_i686: ${{ needs.core.outputs.i686 }}
          VERDICT_x86_64: ${{ needs.core.outputs.x86_64 }}
        run: sh tools/ci/report.sh core ${{ needs.head.outputs.sha }} "$RUNNER_TEMP/results"
