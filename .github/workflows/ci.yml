# ci: the core tier on both architectures after each push to master.
#
# The jobs run on the testing host's two runners, rach2-ci-1 and rach2-ci-2,
# which run as the user ghrunner in WSL; tools/Readme.md describes them. A
# runner keeps its checkout and its build/ between jobs, so a job rebuilds
# only what changed. One core run runs at a time and is never cancelled; of
# the pushes made while it runs, only the newest waits, since GitHub cancels a
# waiting run when a newer one joins the group. The first job reads the newest
# master once the run starts, and both architectures test that one commit, one
# on each runner; a commit whose `ci/core` status an earlier run set, once it
# had reported everything, is not tested again. tools/ci/run.sh runs the
# build, `tests/run style`, `tests/run host` and `tests/run core`; each
# architecture's output and kept logs are uploaded for every account to fetch,
# and tools/ci/report.sh sets the commit's status, files a failure as an
# issue, starts bisect.yml for a new one, and opens or closes the `hold`
# issue. A run that a person cancels reports nothing. The core step has 170
# minutes, inside the job's 180, after which timeout(1) stops the run as
# tools/ci/run.sh describes, and the run is reported as unfinished.
name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: core
  cancel-in-progress: false

jobs:
  head:
    runs-on: [self-hosted, rach2]
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tested: ${{ steps.head.outputs.tested }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/master" --jq .sha)
          tested=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "ci/core")] | length')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  core:
    needs: head
    if: needs.head.outputs.tested == '0'
    runs-on: [self-hosted, rach2]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: core
        run: timeout -k 60 170m sh tools/ci/run.sh core "$RUNNER_TEMP/core-$ARCH"

      - name: keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.arch }}
          path: ${{ runner.temp }}/core-${{ matrix.arch }}
          retention-days: 14

  report:
    needs: [head, core]
    if: ${{ !cancelled() && needs.head.result == 'success' && needs.head.outputs.tested == '0' }}
    runs-on: [self-hosted, rach2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: results
        run: mkdir -p "$RUNNER_TEMP/results"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/results

      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci/report.sh core ${{ needs.head.outputs.sha }} "$RUNNER_TEMP/results"
