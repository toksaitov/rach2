# The selected commit supplies its runner label, accelerator and CI entry.
# Native entry is activated with its installed site, reference and retention
# policy. Its preparation, execution and cleanup share the ten-minute budget.
# Only the newest waiting master commit runs after the active check ends.
name: Core tests

on:
  push:
    branches: [master]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: core
  cancel-in-progress: false

jobs:
  head:
    name: Choose the commit
    runs-on: [self-hosted, rach2]
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tested: ${{ steps.head.outputs.tested }}
      runner: ${{ steps.site.outputs.runner }}
      labels: ${{ steps.site.outputs.labels }}
      accelerator: ${{ steps.site.outputs.accelerator }}
      native: ${{ steps.site.outputs.native }}
    steps:
      - name: Find master's newest commit and whether it was tested
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/$REPO/commits/master" --jq .sha)
          tested=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "ci/core")] | length')
          [ "$EVENT" != workflow_dispatch ] || tested=0
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Check out the selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Read the selected test machine
        id: site
        run: |
          sh tools/ci/site.sh tools/ci/site > "$RUNNER_TEMP/core-site"
          cat "$RUNNER_TEMP/core-site" >> "$GITHUB_OUTPUT"
          if grep -qx 'results=native' tools/ci/run.sh; then
              echo 'native=true' >> "$GITHUB_OUTPUT"
          else
              echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Test both architectures on ${{ needs.head.outputs.runner }}
    needs: head
    if: needs.head.outputs.tested == '0'
    runs-on: ${{ fromJSON(needs.head.outputs.labels) }}
    # The legacy entry retains its old job guard until native activation.
    timeout-minutes: ${{ needs.head.outputs.native == 'true' && 30 || 180 }}
    outputs:
      i686: ${{ steps.verdict.outputs.i686 }}
      x86_64: ${{ steps.verdict.outputs.x86_64 }}
    env:
      ARCH: i686 x86_64
      RACH2_QEMU_ACCEL: ${{ needs.head.outputs.accelerator }}
      ETUDE_NATIVE_ENTRY: ${{ needs.head.outputs.native }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Take the environment of a core run
        run: grep -E '^[A-Z_][A-Z0-9_]*=' tools/ci/core.env >> "$GITHUB_ENV"

      - name: Allocate the selected entry's results
        id: retention
        run: |
          if [ "$ETUDE_NATIVE_ENTRY" = true ]; then
              program=${ETUDE:-$(sed -n 's/^etude //p' "${ETUDE_SITE:?native site is absent}")}
              case $program in /*|[A-Za-z]:/*) ;; *) echo 'ci: installed Etude is absent' >&2; exit 2 ;; esac
              "$program" prepare retention --policy "${ETUDE_RETENTION:?native retention policy is absent}" --site "${ETUDE_SITE:?native site is absent}" allocate --reference "${ETUDE_REFERENCE:?native reference is absent}" --github-env "$GITHUB_ENV"
              echo "ETUDE=$program" >> "$GITHUB_ENV"
          else
              out=$(mktemp -d "$RUNNER_TEMP/core-results.XXXXXX")
              echo "ETUDE_RESULTS=$out" >> "$GITHUB_ENV"
          fi

      - name: Prepare and run style, host and core
        run: sh tools/ci/run.sh core "$ETUDE_RESULTS"

      - name: Record the result for the report
        id: verdict
        if: ${{ always() && steps.retention.outcome == 'success' }}
        run: |
          for arch in i686 x86_64; do
              out=$ETUDE_RESULTS/core-$arch
              if [ -f "$out/done" ] && [ -f "$out/failed" ]; then
                  echo "$arch=done $(tr '\n' ' ' < "$out/failed")" >> "$GITHUB_OUTPUT"
              fi
          done

      - name: Stage the shared native evidence
        if: ${{ always() && needs.head.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        run: |
          "${ETUDE:?native Etude is absent}" prepare evidence stage "$ETUDE_RESULTS" "$RUNNER_TEMP/native-evidence"

      - name: Upload the shared native evidence
        if: ${{ always() && needs.head.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-native-evidence
          path: ${{ runner.temp }}/native-evidence
          retention-days: 14

      - name: Upload the i686 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-i686
          path: ${{ env.ETUDE_RESULTS }}/core-i686
          retention-days: 14

      - name: Upload the x86_64 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-x86_64
          path: ${{ env.ETUDE_RESULTS }}/core-x86_64
          retention-days: 14

  report:
    name: Report the results
    needs: [head, core]
    if: ${{ !cancelled() && needs.head.result == 'success' && needs.head.outputs.tested == '0' }}
    runs-on: [self-hosted, rach2]
    steps:
      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.head.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Make the results directory
        run: mkdir -p "$RUNNER_TEMP/results"

      - name: Download the logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/results

      - name: Restore the shared native evidence
        if: needs.head.outputs.native == 'true'
        run: |
          program=${ETUDE:-$(sed -n 's/^etude //p' "${ETUDE_SITE:?native site is absent}")}
          case $program in /*|[A-Za-z]:/*) ;; *) echo 'ci: installed Etude is absent' >&2; exit 2 ;; esac
          "$program" prepare evidence restore "$RUNNER_TEMP/results/core-native-evidence" "$RUNNER_TEMP/results"

      - name: Set the commit's status and file failures as issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT_i686: ${{ needs.core.outputs.i686 }}
          VERDICT_x86_64: ${{ needs.core.outputs.x86_64 }}
        run: sh tools/ci/report.sh core ${{ needs.head.outputs.sha }} "$RUNNER_TEMP/results"
