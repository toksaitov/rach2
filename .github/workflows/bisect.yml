# bisect: find the commit that made a ci failure, started by
# tools/ci/report.sh for each new failure issue whose last pass it found,
# and for an `intermittent` issue whose failure a later run repeated.
#
# It runs outside the core runs' group, on the failing commit's selected
# machine and accelerator, one run at a time
# for each issue. tools/ci/bisect.sh tests the failing commit again, halves
# the commits since the last pass, and comments on the issue with the commit
# it names, an unresolved range, or a failure that did not repeat. Each test
# runs one architecture with that architecture's time limit in the run that
# failed, 170 minutes, or 340 for a full run, so that a bisection can outlast
# one job. The script has 700 minutes, inside the job's
# 720, and when the time left cannot hold the next test it starts a new run
# of this workflow on the range left, with `confirmed` set. Each test of a
# core failure runs in the environment of master's tools/ci/core.env, which
# ci.yml's core jobs also take. `run` is the ID of the ci run that reported
# the failure; the script does not label the issue intermittent once a later
# run has reported it. `kind` also takes `night`, the kind of the nightly
# runs that full runs replaced, which a bisection started before them passes
# on. The job runs master's copy of the script from outside the tree, since
# the script checks out each commit it tests, and builds master's etude in
# the cache of etude's versions, also outside the tree, so that a machine
# where etude admits tests runs each test through that version's `etude
# admit`. The run's title names the issue, by which the manager finds
# and cancels the run of an issue that has been closed.
name: Bisect a failure
run-name: 'Bisect #${{ inputs.issue }}: ${{ inputs.items }} on ${{ inputs.arch }}'

on:
  workflow_dispatch:
    inputs:
      kind:
        description: The kind of run that failed, core or full (night for an older issue)
        required: true
      arch:
        description: The architecture, i686 or x86_64
        required: true
      good:
        description: The last commit that passed
        required: true
      bad:
        description: The commit that failed
        required: true
      items:
        description: What failed, separated by spaces
        required: true
      issue:
        description: The failure's issue number
        required: true
      confirmed:
        description: yes when an earlier run saw the failing commit fail again
        required: false
        default: ''
      run:
        description: The ID of the ci run that reported the failure
        required: false
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: bisect-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  site:
    name: Read the failing commit's test machine
    runs-on: [self-hosted, rach2]
    outputs:
      labels: ${{ steps.site.outputs.labels }}
      accelerator: ${{ steps.site.outputs.accelerator }}
    steps:
      - name: Check out the current tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 0
      - name: Read the failing commit's site
        id: site
        env:
          BAD: ${{ inputs.bad }}
        run: |
          case "$BAD" in ''|*[!0-9a-f]*) exit 2 ;; esac
          [ "${#BAD}" -eq 40 ] || exit 2
          if git cat-file -e "$BAD:tools/ci/site" 2>/dev/null; then
              git show "$BAD:tools/ci/site" > "$RUNNER_TEMP/bisect-site"
          else
              cp tools/ci/site "$RUNNER_TEMP/bisect-site"
          fi
          sh tools/ci/site.sh "$RUNNER_TEMP/bisect-site" >> "$GITHUB_OUTPUT"

  bisect:
    name: Find the commit that caused the failure
    needs: site
    runs-on: ${{ fromJSON(needs.site.outputs.labels) }}
    env:
      RACH2_QEMU_ACCEL: ${{ needs.site.outputs.accelerator }}
    timeout-minutes: 720
    steps:
      - name: Check out master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 0

      - name: Test the commits since the last pass
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          ARCH_IN: ${{ inputs.arch }}
          GOOD: ${{ inputs.good }}
          BAD: ${{ inputs.bad }}
          ISSUE: ${{ inputs.issue }}
          ITEMS: ${{ inputs.items }}
          CONFIRMED: ${{ inputs.confirmed }}
          RUN: ${{ inputs.run }}
        run: |
          case "$KIND" in core|full|night) ;; *) echo "bisect: refused: kind '$KIND'" >&2; exit 2 ;; esac
          case "$ARCH_IN" in i686|x86_64) ;; *) echo "bisect: refused: architecture '$ARCH_IN'" >&2; exit 2 ;; esac
          case "$GOOD$BAD$ISSUE" in *[!0-9a-f]*) echo "bisect: refused: a commit or issue that is not hexadecimal" >&2; exit 2 ;; esac
          case "$ITEMS" in *[!a-z0-9\ -]*) echo "bisect: refused: items '$ITEMS'" >&2; exit 2 ;; esac
          case "$CONFIRMED" in '') set -- ;; yes) set -- -c ;; *) echo "bisect: refused: confirmed '$CONFIRMED'" >&2; exit 2 ;; esac
          case "$RUN" in '') ;; *[!0-9]*) echo "bisect: refused: run '$RUN'" >&2; exit 2 ;; *) set -- "$@" -r "$RUN" ;; esac
          if version=$(sh tools/etude/provision_version.sh -l); then
              set -- "$@" -e "${version##* }/bin/etude"
          else
              echo "bisect: etude could not be built, so a machine where etude admits tests cannot bisect" >&2
          fi
          cp tools/ci/bisect.sh "$RUNNER_TEMP/bisect.sh"
          # shellcheck disable=SC2086 # the items are one word each
          sh "$RUNNER_TEMP/bisect.sh" "$@" -m 700 "$KIND" "$ARCH_IN" "$GOOD" "$BAD" "$ISSUE" $ITEMS

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bisect-${{ inputs.issue }}
          path: ${{ runner.temp }}/bisect
          retention-days: 14
