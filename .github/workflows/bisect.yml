# bisect: find the commit that made a ci failure, started by
# tools/ci/report.sh for each new failure issue whose last pass it found,
# and for an `intermittent` issue whose failure a later run repeated.
#
# It runs outside the core runs' group, on either runner, one run at a time
# for each issue. tools/ci/bisect.sh tests the failing commit again, halves
# the commits since the last pass, and comments on the issue with the commit
# it names, an unresolved range, or a failure that did not repeat. Each test
# has the time limit of the run that failed, 170 or 340 minutes, so that a
# bisection can outlast one job. The script has 700 minutes, inside the job's
# 720, and when the time left cannot hold the next test it starts a new run
# of this workflow on the range left, with `confirmed` set. `run` is the ID
# of the ci run that reported the failure; the script does not label the
# issue intermittent once a later run has reported it. `kind` also takes
# `night`, the kind of the nightly runs that full runs replaced, which a
# bisection started before them passes on. The job runs master's copy of the
# script from outside the tree, since the script checks out each commit it
# tests.
name: bisect

on:
  workflow_dispatch:
    inputs:
      kind:
        description: The kind of run that failed, core or full (night for an older issue)
        required: true
      arch:
        description: The architecture, i686 or x86_64
        required: true
      good:
        description: The last commit that passed
        required: true
      bad:
        description: The commit that failed
        required: true
      items:
        description: What failed, separated by spaces
        required: true
      issue:
        description: The failure's issue number
        required: true
      confirmed:
        description: yes when an earlier run saw the failing commit fail again
        required: false
        default: ''
      run:
        description: The ID of the ci run that reported the failure
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: bisect-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  bisect:
    runs-on: [self-hosted, rach2]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 0

      - name: bisect
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          ARCH_IN: ${{ inputs.arch }}
          GOOD: ${{ inputs.good }}
          BAD: ${{ inputs.bad }}
          ISSUE: ${{ inputs.issue }}
          ITEMS: ${{ inputs.items }}
          CONFIRMED: ${{ inputs.confirmed }}
          RUN: ${{ inputs.run }}
        run: |
          case "$KIND" in core|full|night) ;; *) echo "bisect: refused: kind '$KIND'" >&2; exit 2 ;; esac
          case "$ARCH_IN" in i686|x86_64) ;; *) echo "bisect: refused: architecture '$ARCH_IN'" >&2; exit 2 ;; esac
          case "$GOOD$BAD$ISSUE" in *[!0-9a-f]*) echo "bisect: refused: a commit or issue that is not hexadecimal" >&2; exit 2 ;; esac
          case "$ITEMS" in *[!a-z0-9\ -]*) echo "bisect: refused: items '$ITEMS'" >&2; exit 2 ;; esac
          case "$CONFIRMED" in '') set -- ;; yes) set -- -c ;; *) echo "bisect: refused: confirmed '$CONFIRMED'" >&2; exit 2 ;; esac
          case "$RUN" in '') ;; *[!0-9]*) echo "bisect: refused: run '$RUN'" >&2; exit 2 ;; *) set -- "$@" -r "$RUN" ;; esac
          cp tools/ci/bisect.sh "$RUNNER_TEMP/bisect.sh"
          # shellcheck disable=SC2086 # the items are one word each
          sh "$RUNNER_TEMP/bisect.sh" "$@" -m 700 "$KIND" "$ARCH_IN" "$GOOD" "$BAD" "$ISSUE" $ITEMS

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bisect-${{ inputs.issue }}
          path: ${{ runner.temp }}/bisect
          retention-days: 14
