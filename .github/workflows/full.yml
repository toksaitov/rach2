# full: every suite on both architectures, built from clean, at one commit,
# on the one machine that the commit's tools/ci/site selects.
#
# tools/flow/release.sh starts a run when a phase's work is finished and
# reviewed, and a person may start one with `gh workflow run full.yml -f
# sha=SHA`. The input is the commit's whole hash, forty lowercase hexadecimal
# digits; the first step refuses anything else. The optional input `title`
# is the run's title, which release.sh sets to name the commit by its short
# hash and the phase, and by which it finds the run. The optional input
# `suites`, `ARCH:SUITE` words such as `x86_64:agents`, makes the run test
# only those suites; release.sh sets it when the commit differs from a commit
# that failed a full run only by the fixes of those failures. The first job,
# on any runner labelled rach2, checks the inputs, checks out the commit and
# reads its tools/ci/site with its tools/ci/site.sh: the label of the runners
# of the machine that runs the release tests, and the accelerator they ask
# QEMU for. A commit without those files, or whose site the script refuses,
# gets no run. The second job runs on a self-hosted runner with that label,
# and sets RACH2_QEMU_ACCEL to the accelerator, so that every machine of the
# run asks QEMU for it alone, whatever the runner's own environment gives.
# One full run goes at a time, outside the core runs' group, and none is
# cancelled; of the runs started while one runs, only the newest waits, since
# GitHub cancels a waiting run when a newer one joins the group. The run tests
# both architectures on one runner, so that the core runs keep the other:
# tools/ci/run.sh, with `ARCH='i686 x86_64'`, builds each from clean, keeping
# the vendored builds, and runs every suite of both, or those that `suites`
# names, as one run of tests/run, whose cases share one schedule, and then
# `bigmem` alone; it leaves a directory of results for each architecture.
# tools/ci/report.sh sets the statuses `ci/full/ARCH` and `ci/full`, or for
# a run of chosen suites `ci/rerun/ARCH` and `ci/rerun`, files what fails as
# core runs do, and starts bisect.yml for a new failure. A run that a person
# cancels reports nothing. GitHub cancels a job that passes its time limit
# too, so the run has 680 minutes inside the job's, which leave time for the
# report. At the limit timeout(1) sends TERM to the run's process group, and
# run.sh ends once tests/run has stopped its machines; both architectures
# are then reported as unfinished.
name: Release tests
run-name: ${{ inputs.title || format('Release tests of {0}', inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The whole hash of the commit to test
        required: true
      title:
        description: The run's title
        required: false
        default: ''
      suites:
        description: Only these suites, as ARCH:SUITE words; empty for every suite
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: full
  cancel-in-progress: false

jobs:
  site:
    name: Check the inputs and read the commit's site
    runs-on: [self-hosted, rach2]
    timeout-minutes: 30
    outputs:
      runner: ${{ steps.site.outputs.runner }}
      labels: ${{ steps.site.outputs.labels }}
      accelerator: ${{ steps.site.outputs.accelerator }}
    steps:
      - name: Check the inputs
        env:
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
        run: |
          case "$SHA" in
              ''|*[!0-9a-f]*) echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1; }
          set -f
          for w in $SUITES; do
              case "$w" in
                  i686:*[!a-z0-9-]*|x86_64:*[!a-z0-9-]*|i686:|x86_64:) ;;
                  i686:*|x86_64:*) continue ;;
              esac
              echo "full: refused: '$w' is not ARCH:SUITE" >&2
              exit 1
          done

      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Read the machine and the accelerator of the release tests
        id: site
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [ -f tools/ci/site ] && [ -f tools/ci/site.sh ] || {
              echo "full: refused: $SHA has no tools/ci/site to select the machine of the release tests" >&2
              exit 1
          }
          sh tools/ci/site.sh tools/ci/site > "$RUNNER_TEMP/site" || exit 1
          cat "$RUNNER_TEMP/site"
          cat "$RUNNER_TEMP/site" >> "$GITHUB_OUTPUT"

  full:
    name: Build and test both architectures on ${{ needs.site.outputs.runner }} under ${{ needs.site.outputs.accelerator }}
    needs: site
    runs-on: ${{ fromJSON(needs.site.outputs.labels) }}
    timeout-minutes: 720
    env:
      RACH2_QEMU_ACCEL: ${{ needs.site.outputs.accelerator }}
    steps:
      - name: Check out the commit
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Build and test both architectures
        env:
          ARCH: i686 x86_64
          SUITES: ${{ inputs.suites }}
        run: timeout -k 60 680m sh tools/ci/run.sh full "$RUNNER_TEMP/results"

      - name: Upload the i686 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-i686
          path: ${{ runner.temp }}/results/full-i686
          retention-days: 14

      - name: Upload the x86_64 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-x86_64
          path: ${{ runner.temp }}/results/full-x86_64
          retention-days: 14

      - name: Set the commit's status and file failures as issues
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
        run: sh tools/ci/report.sh full "$SHA" "$RUNNER_TEMP/results"
