# The release tests of tools/flow/release.sh: every suite of both
# architectures at the commit SHA, its in-house code built from clean, and the
# i686 cases on the x86-64 kernel, `ia32`, or only the ARCH:SUITE words of
# `suites`, ARCH being i686, x86_64 or ia32. The commit's tools/ci/site
# selects the runner and accelerator.
# `cases`, case identities, limits the suites to those cases. The failures go
# to the artifact `failures`, one ARCH:ITEM a line, beside `cases`, one
# `ARCH:SUITE CASE` line for each case that did not pass, which release.sh
# downloads. Native preparation, execution and cleanup share the
# four-hour ceiling.
name: Release tests
run-name: ${{ inputs.title || format('Release tests of {0}', inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The whole hash of the commit to test
        required: true
      title:
        description: The run's title
        required: false
        default: ''
      suites:
        description: Only these suites, as ARCH:SUITE words, ARCH being i686, x86_64 or ia32; empty for every suite
        required: false
        default: ''
      cases:
        description: Only these cases of the suites, as case identities; empty for every case
        required: false
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: full
  cancel-in-progress: false

jobs:
  site:
    name: Check the inputs and read the commit's site
    runs-on: [self-hosted, rach2]
    timeout-minutes: 30
    outputs:
      runner: ${{ steps.site.outputs.runner }}
      labels: ${{ steps.site.outputs.labels }}
      accelerator: ${{ steps.site.outputs.accelerator }}
      native: ${{ steps.site.outputs.native }}
    steps:
      - name: Check the inputs
        env:
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
          CASES: ${{ inputs.cases }}
        run: |
          case "$CASES" in
              *[!a-z0-9_.\ -]*) echo "full: refused: the cases are not case identities: $CASES" >&2; exit 1 ;;
          esac
          case "$SHA" in
              ''|*[!0-9a-f]*) echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1; }
          set -f
          for w in $SUITES; do
              case "$w" in
                  i686:*[!a-z0-9-]*|x86_64:*[!a-z0-9-]*|ia32:*[!a-z0-9-]*|i686:|x86_64:|ia32:) ;;
                  i686:*|x86_64:*|ia32:*) continue ;;
              esac
              echo "full: refused: '$w' is not ARCH:SUITE" >&2
              exit 1
          done

      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Read the machine and the accelerator of the release tests
        id: site
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [ -f tools/ci/site ] && [ -f tools/ci/site.sh ] || {
              echo "full: refused: $SHA has no tools/ci/site to select the machine of the release tests" >&2
              exit 1
          }
          sh tools/ci/site.sh tools/ci/site > "$RUNNER_TEMP/site" || exit 1
          cat "$RUNNER_TEMP/site"
          cat "$RUNNER_TEMP/site" >> "$GITHUB_OUTPUT"
          if grep -qx 'results=native' tools/ci/run.sh; then
              echo 'native=true' >> "$GITHUB_OUTPUT"
          else
              echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

  full:
    name: Build and test both architectures and ia32 on ${{ needs.site.outputs.runner }} under ${{ needs.site.outputs.accelerator }}
    needs: site
    runs-on: ${{ fromJSON(needs.site.outputs.labels) }}
    timeout-minutes: 4320
    env:
      RACH2_QEMU_ACCEL: ${{ needs.site.outputs.accelerator }}
      ETUDE_NATIVE_ENTRY: ${{ needs.site.outputs.native }}
    steps:
      - name: Check out the commit
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Allocate the selected entry's results
        id: retention
        run: |
          if [ "$ETUDE_NATIVE_ENTRY" = true ]; then
              program=${ETUDE:-$(sed -n 's/^etude //p' "${ETUDE_SITE:?native site is absent}")}
              case $program in /*|[A-Za-z]:/*) ;; *) echo 'ci: installed Etude is absent' >&2; exit 2 ;; esac
              "$program" prepare retention --policy "${ETUDE_RETENTION:?native retention policy is absent}" --site "${ETUDE_SITE:?native site is absent}" allocate --reference "${ETUDE_REFERENCE:?native reference is absent}" --github-env "$GITHUB_ENV"
              echo "ETUDE=$program" >> "$GITHUB_ENV"
          else
              out=$(mktemp -d "$RUNNER_TEMP/full-results.XXXXXX")
              echo "ETUDE_RESULTS=$out" >> "$GITHUB_ENV"
          fi

      - name: Put the Doom WAD in the copy
        run: |
          # Git keeps no WAD; the runner's site keeps the shareware one.
          [ -f ports/doom/doom1.wad ] || cp /etc/rach2/doom1.wad ports/doom/doom1.wad || {
              echo 'full: the copy has no ports/doom/doom1.wad and the runner no /etc/rach2/doom1.wad' >&2
              exit 1
          }
          sh ports/doom/fetch_wad.sh

      # The style cases that need no build run first, so that a slip in the
      # sources ends the run in minutes. The suite's own run has them too,
      # beside the cases that read what the build makes.
      - name: Check the sources before the build
        if: ${{ inputs.suites == '' || contains(inputs.suites, ':style') }}
        env:
          ARCH: i686 x86_64
        run: |
          RACH2_CASES=
          for c in assignments clang-format conventions cppcheck devlog links \
              messages registry shellcheck sizes sources text waits; do
              RACH2_CASES="$RACH2_CASES host.style.$c"
          done
          export RACH2_CASES
          tests/run style

      - name: Build and test both architectures and the i686 cases on the x86-64 kernel
        env:
          ARCH: i686 x86_64
          SUITES: ${{ inputs.suites }}
          RACH2_RERUN_CASES: ${{ inputs.cases }}
          # The testing host's 32 threads and 125 GiB; the defaults are 8
          # workers and 16 GiB.
          RACH2_WORKERS: 20
          RACH2_MEMORY_MIB: 65536
        run: sh tools/ci/run.sh full "$ETUDE_RESULTS"

      - name: Stage the shared native evidence
        if: ${{ always() && needs.site.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        run: |
          "${ETUDE:?native Etude is absent}" prepare evidence stage "$ETUDE_RESULTS" "$RUNNER_TEMP/native-evidence"

      - name: Upload the shared native evidence
        if: ${{ always() && needs.site.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-native-evidence
          path: ${{ runner.temp }}/native-evidence
          retention-days: 3

      - name: Upload the i686 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-i686
          # A kept case's copies are its disk images, sparse files of up to
          # 10 GiB that would take an hour to upload; the logs leave them out.
          path: |
            ${{ env.ETUDE_RESULTS }}/full-i686
            !${{ env.ETUDE_RESULTS }}/full-i686/kept/*/copies
          retention-days: 3

      - name: Upload the x86_64 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-x86_64
          # A kept case's copies are its disk images, sparse files of up to
          # 10 GiB that would take an hour to upload; the logs leave them out.
          path: |
            ${{ env.ETUDE_RESULTS }}/full-x86_64
            !${{ env.ETUDE_RESULTS }}/full-x86_64/kept/*/copies
          retention-days: 3

      - name: Upload the ia32 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-ia32
          # The native entry writes no full-ia32.
          path: |
            ${{ env.ETUDE_RESULTS }}/full-ia32
            !${{ env.ETUDE_RESULTS }}/full-ia32/kept/*/copies
          if-no-files-found: ignore
          retention-days: 3

      - name: Write down the failures
        id: report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
        run: sh tools/ci/report.sh "$SHA" "${ETUDE_RESULTS:-$RUNNER_TEMP/unallocated-results}" "$RUNNER_TEMP/failures" "$RUNNER_TEMP/cases"

      - name: Upload the failures
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: failures
          path: |
            ${{ runner.temp }}/failures
            ${{ runner.temp }}/cases
          if-no-files-found: ignore
          retention-days: 3
