# Release checks use the requested commit's explicitly selected CI entry.
# The requested commit selects the runner and accelerator. The optional
# ARCH:SUITE list limits a repair run; otherwise every case is included.
# Native preparation, execution and cleanup share the four-hour ceiling.
name: Release tests
run-name: ${{ inputs.title || format('Release tests of {0}', inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The whole hash of the commit to test
        required: true
      title:
        description: The run's title
        required: false
        default: ''
      suites:
        description: Only these suites, as ARCH:SUITE words; empty for every suite
        required: false
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write

concurrency:
  group: full
  cancel-in-progress: false

jobs:
  site:
    name: Check the inputs and read the commit's site
    runs-on: [self-hosted, rach2]
    timeout-minutes: 30
    outputs:
      runner: ${{ steps.site.outputs.runner }}
      labels: ${{ steps.site.outputs.labels }}
      accelerator: ${{ steps.site.outputs.accelerator }}
      native: ${{ steps.site.outputs.native }}
    steps:
      - name: Check the inputs
        env:
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
        run: |
          case "$SHA" in
              ''|*[!0-9a-f]*) echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "full: refused: '$SHA' is not a commit's whole hash" >&2; exit 1; }
          set -f
          for w in $SUITES; do
              case "$w" in
                  i686:*[!a-z0-9-]*|x86_64:*[!a-z0-9-]*|i686:|x86_64:) ;;
                  i686:*|x86_64:*) continue ;;
              esac
              echo "full: refused: '$w' is not ARCH:SUITE" >&2
              exit 1
          done

      - name: Check out the commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Read the machine and the accelerator of the release tests
        id: site
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [ -f tools/ci/site ] && [ -f tools/ci/site.sh ] || {
              echo "full: refused: $SHA has no tools/ci/site to select the machine of the release tests" >&2
              exit 1
          }
          sh tools/ci/site.sh tools/ci/site > "$RUNNER_TEMP/site" || exit 1
          cat "$RUNNER_TEMP/site"
          cat "$RUNNER_TEMP/site" >> "$GITHUB_OUTPUT"
          if grep -qx 'results=native' tools/ci/run.sh; then
              echo 'native=true' >> "$GITHUB_OUTPUT"
          else
              echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

  full:
    name: Build and test both architectures on ${{ needs.site.outputs.runner }} under ${{ needs.site.outputs.accelerator }}
    needs: site
    runs-on: ${{ fromJSON(needs.site.outputs.labels) }}
    timeout-minutes: 270
    env:
      RACH2_QEMU_ACCEL: ${{ needs.site.outputs.accelerator }}
      ETUDE_NATIVE_ENTRY: ${{ needs.site.outputs.native }}
    steps:
      - name: Check out the commit
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Allocate the selected entry's results
        id: retention
        run: |
          if [ "$ETUDE_NATIVE_ENTRY" = true ]; then
              python3 tools/ci/retention.py --policy "${ETUDE_RETENTION:?native retention policy is absent}" --site "${ETUDE_SITE:?native site is absent}" allocate --reference "${ETUDE_REFERENCE:?native reference is absent}" --github-env "$GITHUB_ENV"
          else
              out=$(mktemp -d "$RUNNER_TEMP/full-results.XXXXXX")
              echo "ETUDE_RESULTS=$out" >> "$GITHUB_ENV"
          fi

      - name: Build and test both architectures
        env:
          ARCH: i686 x86_64
          SUITES: ${{ inputs.suites }}
        run: sh tools/ci/run.sh full "$ETUDE_RESULTS"

      - name: Stage the shared native evidence
        if: ${{ always() && needs.site.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        run: python3 tools/ci/native_evidence.py stage "$ETUDE_RESULTS" "$RUNNER_TEMP/native-evidence"

      - name: Upload the shared native evidence
        if: ${{ always() && needs.site.outputs.native == 'true' && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-native-evidence
          path: ${{ runner.temp }}/native-evidence
          retention-days: 14

      - name: Upload the i686 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-i686
          path: ${{ env.ETUDE_RESULTS }}/full-i686
          retention-days: 14

      - name: Upload the x86_64 logs
        if: ${{ always() && steps.retention.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-x86_64
          path: ${{ env.ETUDE_RESULTS }}/full-x86_64
          retention-days: 14

      - name: Set the commit's status and file failures as issues
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          SUITES: ${{ inputs.suites }}
        run: sh tools/ci/report.sh full "$SHA" "${ETUDE_RESULTS:-$RUNNER_TEMP/unallocated-results}"
