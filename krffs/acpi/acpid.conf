# /etc/acpid.conf: the action BusyBox's acpid runs for each event of
# /etc/acpi.map, one to a line: a word of the event's description, then the
# action, a file under /etc/acpi that acpid runs with no argument. The first
# line whose word the description contains is taken.
PBTN  power
MUTE  volume/mute
VOLDN volume/down
VOLUP volume/up
BRTDN brightness/down
BRTUP brightness/up
