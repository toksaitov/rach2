# The configuration built into GRUB's EFI image, `vendor/grub/bootx64.efi`,
# which UEFI firmware starts as \EFI\BOOT\BOOTX64.EFI from an EFI system
# partition. It is the EFI counterpart of `grub-embed.cfg`, and differs from
# it in one way: the firmware has already chosen the partition, and GRUB sets
# `prefix` to /boot/grub on the device it was loaded from, so the menu is found
# there and not by a search. On an installed disk that device is the boot
# partition; on a stick written from an ISO it is the stick's EFI boot image,
# whose menu finds the ISO's own; on a CD it is the CD.
#
# The early parser this runs through has no `if`, as in `grub-embed.cfg`. The
# first `configfile` opens the menu and does not return when the menu boots
# something; the search for the recovery partition runs only when that menu
# could not be read at all.
configfile $prefix/grub.cfg
search --no-floppy --label RACH2RECOV --set=root
configfile ($root)/boot/grub/recovery.cfg
