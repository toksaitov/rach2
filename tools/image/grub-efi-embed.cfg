# grub-efi-embed.cfg: the configuration built into the EFI image of GRUB,
# vendor/grub/bootx64.efi.
#
# UEFI firmware starts the image as /EFI/BOOT/BOOTX64.EFI from an EFI system
# partition. This file is the EFI counterpart of grub-embed.cfg and differs
# from it in one way: the firmware has already chosen the partition, and GRUB
# sets `prefix` to /boot/grub on the device it was loaded from, so the menu is
# found there and not by a search. On an installed disk that device is the
# boot partition. On a stick written from an ISO it is the EFI boot image of
# the stick, whose own menu finds the file system of the ISO and opens the
# menu there. On a CD it is the CD.
#
# GRUB runs this file with the parser of its rescue mode, as it runs
# grub-embed.cfg, so these comments have no quote mark and no backslash, for
# the reason that file gives. The first `configfile` opens the menu, which
# boots a kernel and does not return. When that menu cannot be read,
# `configfile` returns, and the search and the second `configfile` open the
# menu of the recovery partition.
configfile $prefix/grub.cfg
search --no-floppy --label RACH2RECOV --set=root
configfile ($root)/boot/grub/recovery.cfg
