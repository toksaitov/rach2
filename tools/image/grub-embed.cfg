# The configuration built into the core image, which runs before anything on a
# partition. It is here, in one file, because two builders write cores: the disk
# builder writes the one a disk ships with, and mkgrubcore.sh writes the ones
# `bootctl grub` installs over it. A replacement core without these lines would
# take the recovery path away from a machine that had it, and take it away
# silently, since everything else about that machine would go on working.
#
# The boot partition is found by its file-system label, not by being the
# first partition of the first disk: the machine's disk order is the
# firmware's, and a Rach2 disk behind another disk was a machine that did not
# boot. A label rather than a serial because the core is one pinned image for
# every disk and cannot be given each disk's serial; the menu it opens finds
# the kernel's partition by serial, and the kernel finds its root by the
# identity the menu names.
#
# Two searches and two calls, no test between them: the early parser this runs
# through has no `if`. The first search sets the root to the boot partition
# and the first `configfile` opens the menu there and never returns, because a
# menu that boots something does not come back; the second pair runs only when
# the first could not be read at all, which is a boot partition damaged badly
# enough that nothing else on this disk can start. `configfile` does not
# retarget the root, so the file it opens sets its own.
search --no-floppy --label RACH2BOOT --set=root
configfile ($root)/boot/grub/grub.cfg
search --no-floppy --label RACH2RECOV --set=root
configfile ($root)/boot/grub/recovery.cfg
