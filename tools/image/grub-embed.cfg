# grub-embed.cfg: the configuration built into the GRUB core images that boot
# a disk by BIOS. It runs before GRUB reads anything from a partition.
#
# vendor/grub/regen_grub.sh builds this one file into four cores:
# disk-core.img and gpt-core.img, which tools/image/mkdisk_grub.sh writes to
# the MBR and GPT disks it builds, and disk-core-a.img and disk-core-b.img,
# which have three lines before it that turn on the serial console and print
# a marker. tools/image/mkgrubcore.sh copies one of the marked pair out of
# vendor/grub/ and checks the copy against the manifest, and the grub suite
# installs the pair with `bootctl grub`. The sealed and uefi suites install
# gpt-core.img the same way. So every core this project installs over the
# core of a disk has these lines as well. A core without them would boot a
# healthy machine and could not reach the recovery partition, and nothing
# would show it until the boot partition was damaged.
#
# The boot partition is found by its file-system label and not as the first
# partition of the first disk, since the firmware sets the order of the
# disks. It is a label and not a serial because the core is one pinned image
# for every disk and cannot have the serial of each. The menus it opens find
# their partitions by serial, and the kernel finds its root by the disk
# identity the menu gives on its command line.
#
# GRUB runs an embedded configuration with the parser of its rescue mode,
# which has no `if` and no comments. A line here that begins with a hash mark
# is run as a command GRUB does not know. A quote mark in such a line opens a
# string that goes on through the lines below it, and a backslash at the end
# of one joins the next line to it, and either would take the commands below
# into a comment. So these comments have no quote mark and no backslash.
#
# The commands are two searches and two calls with no test between them. The
# first search sets the root to the boot partition, and the first
# `configfile` opens the menu there, which boots a kernel and does not
# return. When that menu cannot be read, `configfile` returns, and the second
# pair opens the menu of the recovery partition. tools/inspect/cfgcheck.c
# requires these four commands in this order.
search --no-floppy --label RACH2BOOT --set=root
configfile ($root)/boot/grub/grub.cfg
search --no-floppy --label RACH2RECOV --set=root
configfile ($root)/boot/grub/recovery.cfg
