# The configuration built into the core image, which runs before anything on a
# partition. It is here, in one file, because two builders write cores: the disk
# builder writes the one a disk ships with, and mkgrubcore.sh writes the ones
# `bootctl grub` installs over it. A replacement core without these lines would
# take the recovery path away from a machine that had it, and take it away
# silently, since everything else about that machine would go on working.
#
# Two calls and no test between them: the early parser this runs through has no
# `if`. The first opens the menu on partition 1 and never returns, because a
# menu that boots something does not come back; the second runs only when the
# first could not be read at all, which is a boot partition damaged badly enough
# that nothing else on this disk can start. `configfile` does not retarget the
# root, so the file it opens sets its own.
configfile (hd0,msdos1)/boot/grub/grub.cfg
configfile (hd0,msdos3)/boot/grub/recovery.cfg
