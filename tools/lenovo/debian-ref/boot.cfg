# Debian 13 on the trial partition for the 80-2 references, with the IOMMU's
# translation off as the gate's configuration has it. When next_entry is
# recovery, which `bootctl trial recovery` sets, clear and save it before
# loading anything, then boot Debian's kernel and initrd from its root on
# partition 5, an ext4 that GRUB's ext2 module reads. If anything here fails,
# the stub's entries and the saved default boot Rach2.
if [ "${next_entry}" = "recovery" ]; then
    set next_entry=
    save_env next_entry
    insmod linux
    insmod ext2
    search --no-floppy --fs-uuid --set=root 96e538c4-e118-47a5-ad63-ddbd0e67f846
    linux /boot/vmlinuz-6.12.115+deb13.1-amd64 root=PARTUUID=f640712e-b236-4c5a-b7d8-1b149d598ec0 ro ds=nocloud modprobe.blacklist=ath9k,snd_hda_intel panic=10 intel_iommu=off
    initrd /boot/initrd.img-6.12.115+deb13.1-amd64
    boot
fi
