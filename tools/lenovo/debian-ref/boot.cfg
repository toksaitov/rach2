# Debian 13 on the trial partition for the 80-2 references, with the IOMMU's
# translation off as the gate's configuration has it. When next_entry is
# recovery, which `bootctl trial recovery` sets, clear and save it before
# loading anything, then boot Debian's kernel from /run2 with its root on
# partition 5. If anything here fails, the stub's entries and the saved
# default boot Rach2.
if [ "${next_entry}" = "recovery" ]; then
    set next_entry=
    save_env next_entry
    search --no-floppy --fs-uuid --set=root 1ACE-F00D
    insmod linux
    linux /run2/vmlinuz root=PARTUUID=f640712e-b236-4c5a-b7d8-1b149d598ec0 ro ds=nocloud modprobe.blacklist=ath9k,snd_hda_intel panic=10 intel_iommu=off
    initrd /run2/initrd.img
    boot
fi
